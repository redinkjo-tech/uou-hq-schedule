<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>센터 일정판</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg:#f7f0dd; --panel:transparent; --card:#fffdf6; --ink:#141414; --muted:#8a846f; --line:#ebe3cd; --soft:#f1e9d3;
    --brand:#141414; --brand-soft:#efe7d1; --today-line:#141414;
    --trip:#b9c9f3; --trip-ink:#141414;
    --leave:#e9e2d2; --leave-ink:#141414; --leave-line:#d8cfb8;
    --event:#f6d85c; --event-ink:#141414; --event-line:#d9b800;
    --warn-bg:#ffe3e0; --warn:#c8372d; --sun:#e0759f; --sat:#6b86d6;
    --scrim:rgba(20,18,10,.42); --shadow:0 1px 2px rgba(60,50,20,.05), 0 10px 28px rgba(60,50,20,.07);
    --c-trip:#7f9be6; --c-leave:#b3a784; --c-event:#e2b800; --c-teams:#e66bb0;
    --t-trip:#b9c9f3; --t-leave:#e9e2d2; --t-event:#f6d85c; --t-teams:#f6b9dc;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#12110d; --panel:transparent; --card:#201e18; --ink:#f4efe2; --muted:#a39d88; --line:#34312a; --soft:#2a2822;
    --brand:#f4efe2; --brand-soft:#34312a; --today-line:#f4efe2;
    --trip:#3a4a80; --trip-ink:#f4efe2;
    --leave:#3a362c; --leave-ink:#f4efe2; --leave-line:#4d483b;
    --event:#7a6612; --event-ink:#f4efe2; --event-line:#e2b800;
    --warn-bg:#3d1e1b; --warn:#ff9a90; --sun:#ff8fb6; --sat:#9db4ff;
    --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.3);
    --c-trip:#7f9be6; --c-leave:#a39d88; --c-event:#e2b800; --c-teams:#ff8fc8;
    --t-trip:#3a4a80; --t-leave:#3a362c; --t-event:#7a6612; --t-teams:#7a3a62;
  } }
  * { box-sizing:border-box; }
  html, body { overflow-x:hidden; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "Pretendard Variable", Pretendard, -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; letter-spacing:-0.01em; -webkit-font-smoothing:antialiased; }
  main { max-width:1240px; margin:0 auto; padding:28px 20px 48px; }
  button { font:inherit; color:inherit; }

  /* 상단 */
  .top { display:flex; align-items:flex-end; justify-content:space-between; gap:12px 24px; flex-wrap:wrap; margin-bottom:18px; }
  h1 { margin:0; font-size:28px; font-weight:800; letter-spacing:-0.03em; }
  .tagline { margin:2px 0 0; color:var(--muted); font-size:14px; }
  .pills { display:flex; gap:8px; flex-wrap:wrap; }
  .pill { display:inline-flex; align-items:center; gap:7px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-size:12.5px; color:var(--muted); box-shadow:var(--shadow); }
  .pill b { color:var(--ink); font-weight:600; }
  .dot { width:8px; height:8px; border-radius:50%; background:#2fbf8f; }
  .pill.stale { border-color:var(--warn); color:var(--warn); }
  .pill.stale .dot { background:var(--warn); }
  .banner { margin:0 0 14px; padding:12px 16px; border-radius:12px; font-size:14px; background:var(--warn-bg); color:var(--warn); font-weight:600; }

  [hidden] { display:none !important; }
  @media (max-width:640px) { .tv-head .seg { display:inline-flex; } }
  /* 위젯 전용: 새로고침 버튼 · 오류 배너 버튼 */
  .rbtn { display:none; align-items:center; justify-content:center; width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--muted); cursor:pointer; box-shadow:var(--shadow); padding:0; }
  .rbtn.on { display:inline-flex; }
  .rbtn:hover { color:var(--ink); }
  .rbtn svg { width:17px; height:17px; }
  .rbtn.spin svg { animation:spin 1s linear infinite; }
  .rbtn:disabled { cursor:default; opacity:.7; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .banner .acts { display:inline-flex; gap:8px; margin-left:12px; vertical-align:middle; }
  .banner .acts button { border:1px solid currentColor; background:transparent; color:inherit; border-radius:8px; padding:3px 10px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .banner.ok { background:var(--brand-soft); color:var(--brand); }

  /* 팀즈 탭 (내 PC 위젯에서만 보임) */
  .seg button .badge { display:inline-block; min-width:18px; height:18px; line-height:18px; margin-left:6px; padding:0 5px; border-radius:9px; background:var(--sun); color:#fff; font-size:11px; font-weight:700; text-align:center; vertical-align:1px; }
  #teamsView { display:none; }
  #teamsView.on { display:block; }
  .tv-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .tv-head h2 { margin:0; font-size:22px; font-weight:800; letter-spacing:-0.03em; flex:1; min-width:140px; }
  .tv-head .upd { font-size:12.5px; color:var(--muted); }
  .tv-cols { display:grid; grid-template-columns:minmax(0,320px) minmax(0,1fr); gap:16px; align-items:start; }
  @media (max-width:900px) { .tv-cols { grid-template-columns:minmax(0,1fr); } }
  .tv-card { background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); padding:16px 18px; }
  .tv-card h3 { margin:0 0 10px; font-size:15px; font-weight:800; }
  .tv-item { display:flex; align-items:center; gap:8px; background:var(--soft); border-radius:10px; padding:9px 8px 9px 12px; margin:0 0 8px; }
  .tv-item .go { flex:1; min-width:0; text-align:left; border:0; background:transparent; padding:0; cursor:pointer; }
  .tv-item .ok { flex:none; border:1px solid var(--line); background:var(--card); color:var(--brand); font-size:12.5px; font-weight:700; border-radius:8px; padding:5px 10px; cursor:pointer; }
  .tv-item .ok:hover { background:var(--brand-soft); }
  .tv-item.done { opacity:.6; }
  .tv-restore { border:0; background:transparent; color:var(--muted); font-size:12.5px; font-weight:600; padding:4px 0 8px; cursor:pointer; text-decoration:underline; }
  .tv-item .d { font-size:12px; color:var(--muted); font-weight:600; }
  .tv-item .t { font-size:14px; font-weight:600; margin-top:1px; }
  .tv-item .k { display:inline-block; font-size:11px; font-weight:700; padding:1px 7px; border-radius:6px; margin-right:6px; background:var(--event); color:var(--event-ink); }
  .tv-item .k.deadline { background:var(--warn-bg); color:var(--warn); }
  .tv-msg { padding:12px 0; border-top:1px solid var(--line); }
  .tv-msg:first-child { border-top:0; padding-top:2px; }
  .tv-msg .h { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); }
  .tv-msg .h b { color:var(--ink); font-size:14px; }
  .tv-msg .room { font-size:11px; font-weight:700; padding:1px 7px; border-radius:6px; background:var(--soft); color:var(--muted); }
  .tv-msg .new { width:8px; height:8px; border-radius:50%; background:var(--sun); display:inline-block; }
  .tv-msg .flag { font-size:11px; font-weight:700; padding:1px 7px; border-radius:6px; background:var(--event); color:var(--event-ink); }
  .tv-msg .flag.deadline { background:var(--warn-bg); color:var(--warn); }
  .tv-msg .x { margin-top:4px; white-space:pre-wrap; word-break:keep-all; overflow-wrap:anywhere; font-size:14px; max-height:9.5em; overflow:hidden; }
  .tv-msg .x.open { max-height:none; }
  .tv-msg .more { border:0; background:transparent; color:var(--brand); font-weight:600; font-size:12.5px; padding:2px 0; cursor:pointer; }
  .tv-msg a { color:var(--brand); font-size:12.5px; font-weight:600; margin-left:8px; }
  .tv-empty { color:var(--muted); font-size:14px; padding:18px 0; }

  /* 달력 카드 */
  .calcard { background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); padding:18px 18px 14px; }
  .bar-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .bar-head h2 { margin:0; font-size:22px; font-weight:800; letter-spacing:-0.03em; flex:1; min-width:140px; }
  .nav { display:inline-flex; background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:3px; gap:2px; }
  .nav button { border:0; background:transparent; height:32px; min-width:34px; padding:0 10px; border-radius:9px; cursor:pointer; font-size:14px; }
  .nav button:hover:not(:disabled) { background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .nav button:disabled { opacity:.3; cursor:default; }
  .nav .todaybtn { font-weight:600; font-size:13px; }
  .legend { display:flex; gap:14px; font-size:12.5px; color:var(--muted); }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .legend i { width:4px; height:14px; border-radius:2px; display:inline-block; }
  .legend .l-trip { background:var(--c-trip); }
  .legend .l-leave { background:var(--c-leave); }
  .legend .l-event { background:var(--c-event); }

  .dow { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-bottom:1px solid var(--line); }
  .dow div { text-align:center; font-size:12px; font-weight:600; color:var(--muted); padding:8px 0; }
  .dow div:first-child { color:var(--sun); } .dow div:last-child { color:var(--sat); }

  .week { position:relative; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); align-content:start; row-gap:3px; min-height:118px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  .week:last-child { border-bottom:0; }
  .cellbg { position:absolute; inset:0; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); }
  .cell { appearance:none; border:0; background:transparent; border-right:1px solid var(--line); cursor:pointer; padding:0; border-radius:0; }
  .cell:nth-child(7n) { border-right:0; }
  .cell:hover { background:var(--soft); }
  .cell.blank { cursor:default; background:transparent !important; }
  .cell.selected { box-shadow:inset 0 0 0 2px var(--brand); }
  .cell:focus-visible { outline:2px solid var(--brand); outline-offset:-2px; }
  .num { position:relative; grid-row:1; pointer-events:none; padding:6px 0 2px 8px; font-size:13px; font-weight:600; height:34px; }
  .num span { display:inline-grid; place-items:center; min-width:26px; height:26px; border-radius:13px; padding:0 4px; }
  .num.sun { color:var(--sun); } .num.sat { color:var(--sat); }
  .num.past { opacity:.45; }
  .num.today span { font-weight:800; box-shadow:inset 0 0 0 2px var(--today-line); }
  /* 갤럭시 캘린더 스타일: 왼쪽 색 선 + 일반 글씨. 여러 날 이어지는 일정만 옅은 배경으로 연결 */
  .trip { --c:var(--c-trip); --t:var(--t-trip); }
  .leave { --c:var(--c-leave); --t:var(--t-leave); }
  .event { --c:var(--c-event); --t:var(--t-event); }
  .bar, .chip { position:relative; color:var(--ink); }
  .bar::before, .chip::before { content:""; position:absolute; left:0; top:2px; bottom:2px; width:3px; border-radius:2px; background:var(--c); }
  .bar { --m:4px; pointer-events:none; position:absolute; margin:0; padding:2px 6px 2px 10px; border-radius:4px; font-size:12.5px; line-height:1.4; font-weight:500; word-break:keep-all; overflow-wrap:anywhere; background:var(--t); }
  .bar.cl { border-top-left-radius:0; border-bottom-left-radius:0; }
  .bar.cl::before { display:none; }
  .bar.cr { border-top-right-radius:0; border-bottom-right-radius:0; }

  /* 월간/주간 전환 */
  .seg { display:inline-flex; background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:3px; gap:2px; }
  .seg button { border:0; background:transparent; height:32px; padding:0 14px; border-radius:9px; cursor:pointer; font-size:13px; font-weight:600; color:var(--muted); }
  .seg button[aria-pressed="true"] { background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.1); }
  #weekview { display:none; }
  .calcard.wk .dow, .calcard.wk #weeks, .calcard.wk #agenda { display:none; }
  .calcard.wk #weekview { display:block; }
  .wv-row { display:grid; grid-template-columns:52px minmax(0,1fr); }
  .gut { font-size:11px; color:var(--muted); text-align:right; padding-right:8px; position:relative; }
  .wv-days { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-bottom:1px solid var(--line); }
  .wv-day { appearance:none; border:0; background:transparent; cursor:pointer; padding:6px 0 8px; text-align:center; font-size:12px; font-weight:600; color:var(--muted); border-left:1px solid var(--line); }
  .wv-day:first-child { border-left:0; }
  .wv-day b { display:grid; place-items:center; margin:2px auto 0; min-width:30px; height:30px; border-radius:15px; font-size:16px; color:var(--ink); }
  .wv-day.sun, .wv-day.sun b { color:var(--sun); } .wv-day.sat, .wv-day.sat b { color:var(--sat); }
  .wv-day.today b { box-shadow:inset 0 0 0 2px var(--today-line); }
  .wv-day.selected { box-shadow:inset 0 0 0 2px var(--brand); }
  .wv-day:hover { background:var(--soft); }
  .wv-allday { border-bottom:1px solid var(--line); }
  .wv-allday .gut { padding-top:8px; }
  .wv-ad { position:relative; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); align-content:start; row-gap:3px; padding:4px 0; min-height:38px; }
  .wv-ad .bar { position:relative; align-self:start; margin:0 4px; }
  .wv-ad .bar.cl { margin-left:0; } .wv-ad .bar.cr { margin-right:0; }
  .wv-grid { max-height:640px; overflow-y:auto; }
  .wv-cols { position:relative; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); }
  .wv-col { position:relative; border-left:1px solid var(--line); cursor:pointer; }
  .wv-col:first-child { border-left:0; }
  .wv-col:hover { background:var(--soft); }
  .hl { position:absolute; left:0; right:0; border-top:1px solid var(--line); pointer-events:none; }
  .hlab { position:absolute; right:8px; transform:translateY(-50%); font-size:11px; color:var(--muted); }
  .tb { position:absolute; padding:2px 4px 2px 8px; overflow:hidden; border-radius:4px; font-size:12px; line-height:1.3; font-weight:500; background:var(--t); border:1px solid var(--card); color:var(--ink); word-break:keep-all; overflow-wrap:anywhere; }
  .tb::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--c); }
  .tb small { display:block; color:var(--muted); font-weight:500; font-size:11px; }
  .tt { display:none; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; user-select:none; padding:0 4px; }
  .calcard.wk .tt { display:inline-flex; }
  .tt input { accent-color:var(--brand); width:16px; height:16px; margin:0; cursor:pointer; }
  .tb { z-index:1; background:linear-gradient(var(--t),var(--t)), var(--card); }
  .ttb { position:absolute; left:0; right:0; z-index:0; pointer-events:none; padding:2px 6px; overflow:hidden; font-size:11.5px; line-height:1.3; color:var(--muted); background:repeating-linear-gradient(135deg, rgba(120,130,150,.16) 0 6px, rgba(120,130,150,.06) 6px 12px); border:1px dashed rgba(120,130,150,.5); border-radius:4px; }
  .ttb b { font-weight:600; color:var(--ink); opacity:.75; }
  .nowline { position:absolute; left:0; right:0; border-top:2px solid var(--warn); pointer-events:none; z-index:2; }
  .note { color:var(--muted); font-size:12.5px; margin:12px 4px 0; }
  footer { margin:18px 4px 0; color:var(--muted); font-size:12px; line-height:1.6; }

  /* 모바일 목록 */
  #agenda { display:none; }
  .daycard { appearance:none; text-align:left; width:100%; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px; cursor:pointer; display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow); }
  .daycard:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  .daycard.past { opacity:.6; }
  .daycard .dh { font-size:14px; font-weight:700; display:flex; gap:8px; align-items:center; }
  .daycard.sun .dh { color:var(--sun); } .daycard.sat .dh { color:var(--sat); }
  .daycard .tdy { font-size:11px; border:1px solid var(--today-line); color:var(--today-line); border-radius:999px; padding:0 8px; }
  .daycard .chip { display:block; border-radius:6px; padding:6px 10px 6px 14px; font-size:14px; font-weight:500; background:var(--t); }
  .daycard .chip::before { top:5px; bottom:5px; left:5px; }
  .chip small { color:var(--muted); font-weight:500; margin-left:6px; }
  .empty { color:var(--muted); text-align:center; padding:28px 0; }

  /* 드로어 */
  .scrim { position:fixed; inset:0; background:var(--scrim); opacity:0; visibility:hidden; transition:opacity .2s, visibility .2s; z-index:10; backdrop-filter:blur(1px); }
  .scrim.open { opacity:1; visibility:visible; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:500px; max-width:100vw; background:var(--card); box-shadow:-12px 0 40px rgba(0,0,0,.2); transform:translateX(100%); visibility:hidden; transition:transform .24s cubic-bezier(.2,.8,.2,1), visibility .24s; z-index:11; display:flex; flex-direction:column; }
  .drawer.open { transform:translateX(0); visibility:visible; }
  .drawer header { display:flex; align-items:center; gap:14px; padding:20px 20px 16px; border-bottom:1px solid var(--line); }
  .dbig { font-size:38px; font-weight:800; letter-spacing:-0.04em; line-height:1; }
  .dsub { flex:1; color:var(--muted); font-size:14px; line-height:1.3; }
  .dsub b { display:block; color:var(--ink); font-size:16px; }
  .drawer header button { border:0; background:var(--soft); width:36px; height:36px; border-radius:50%; font-size:20px; line-height:1; cursor:pointer; }
  .drawer header button:hover { background:var(--line); }
  .drawer .body { padding:6px 20px 28px; overflow-y:auto; }
  .sec { margin-top:20px; }
  .sec h4 { margin:0 0 8px; font-size:12px; font-weight:700; letter-spacing:.04em; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .sec h4::before { content:""; width:10px; height:10px; border-radius:3px; }
  .sec h4::before { width:4px; height:12px; border-radius:2px; background:var(--c); }
  .item { background:var(--soft); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:8px; }
  .item .t { font-weight:700; font-size:15.5px; }
  .item .s { color:var(--muted); font-size:13.5px; margin-top:3px; white-space:pre-wrap; }
  .item .s.extra { margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); color:var(--ink); font-weight:600; }
  .tag { display:inline-block; font-size:11.5px; padding:1px 8px; border-radius:999px; margin-right:8px; font-weight:700; vertical-align:1px; }
  .tag.trip, .tag.leave { background:var(--t); color:var(--ink); box-shadow:inset 0 0 0 1px var(--c); }

  .trackbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 14px; }
  .trackbar .seg { display:inline-flex; }
  .trackbar .seg button { height:36px; padding:0 18px; font-size:14px; }
  .trackbar .who { font-size:12.5px; color:var(--muted); }
  @media (max-width:900px) {
    main { padding:22px 14px 40px; }
    .week { min-height:104px; }
    .bar { font-size:11.5px; padding:2px 6px; --m:3px; }
  }
  @media (max-width:640px) {
    main { padding:18px 12px 32px; }
    h1 { font-size:24px; }
    .calcard { padding:14px 12px; border-radius:18px; }
    .dow, #weeks { display:none; }
    .seg { display:none; }
    .trackbar .seg { display:inline-flex; }
    #agenda { display:flex; flex-direction:column; gap:10px; }
    .bar-head h2 { font-size:19px; }
    .legend { width:100%; }
  }
  @media (max-width:900px) { .wv-row { grid-template-columns:36px minmax(0,1fr); } .tb { font-size:11px; padding-left:6px; } .wv-day b { min-width:26px; height:26px; font-size:14px; } }
  @media (prefers-reduced-motion: reduce) { .drawer, .scrim { transition:none; } }

  /* ── 테마: 크림 + 블랙 사이드바 (레퍼런스 2) ── */
  .teams { --c:var(--c-teams); --t:var(--t-teams); }
  body { background:var(--bg); }
  .app { display:flex; gap:20px; min-height:100vh; padding:16px; align-items:flex-start; }

<script>
(function () {
  var STALE_HOURS = 24;
  var DOW = ['일','월','화','수','목','금','토'];
  var $ = function (id) { return document.getElementById(id); };
  function pad(n) { return String(n).padStart(2, '0'); }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fmtTs(s) { var d = new Date(s); return pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function md(s) { return Number(s.slice(5, 7)) + '/' + Number(s.slice(8)); }
  function get(url) {
    return fetch(url + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(url + ' ' + r.status); return r.json(); });
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  var today = new Date(); today.setHours(12, 0, 0, 0);
  var todayIso = iso(today);
  var view = { y: today.getFullYear(), m: today.getMonth() };
  var minMonth = 2026 * 12 + 10, maxMonth = view.y * 12 + view.m + 3;   // 일정판을 쓰기 시작한 2026년 11월부터 ~ 이번 달+3개월까지 (지난 달도 계속 볼 수 있음)
  var rangeTo = null;           // UWIN 출장·연가 조회 마지막 날짜
  var items = {};               // 날짜 → 그날의 항목 (드로어·목록용)
  var spans = [];               // 막대용: {kind,start,end,label,time,range}
  var selected = null;
  var track = 'all';            // 보기 구분: all(전체) · C1(평생교육) · B3(탄소중립)
  var ORDER = { event: 0, trip: 1, leave: 2 };

  function add(k, it) { (items[k] = items[k] || []).push(it); }
  function eachDay(start, end, fn) {
    var s = new Date(start + 'T12:00:00'), e = new Date(end + 'T12:00:00'), n = 0;
    for (var d = s; d <= e && n < 400; d = new Date(d.getTime() + 86400000), n++) fn(iso(d));
  }
  function sorted(k) { return (items[k] || []).slice().sort(function (a, b) { return ORDER[a.kind] - ORDER[b.kind]; }); }
  function spanLabel(sp) { return sp.label + (sp.time ? ' ' + sp.time : ''); }

  // ── 월간/주간 전환 ──
  var mode = 'month', weekStart = null;   // weekStart: 보고 있는 주의 일요일(YYYY-MM-DD)
  var timetables = [], holidays = [], ttOn = false;
  try { ttOn = localStorage.getItem('ttOn') === '1'; } catch (e) {}
  var PX = 48;                           // 주간 보기에서 1시간 높이(px)
  function weekMode() { return mode === 'week' && window.innerWidth > 640; }
  function dayAdd(k, n) { var d = new Date(k + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); }
  function sundayOf(k) { return dayAdd(k, -new Date(k + 'T12:00:00').getDay()); }
  function weekBounds() {
    var lo = sundayOf(Math.floor(minMonth / 12) + '-' + pad(minMonth % 12 + 1) + '-01');
    var hi = sundayOf(iso(new Date(Math.floor(maxMonth / 12), maxMonth % 12 + 1, 0, 12)));
    return { lo: lo, hi: hi };
  }
  function parseTime(t) {
    var m = /(\d{1,2}):(\d{2})(?:\s*~\s*(\d{1,2}):(\d{2}))?/.exec(t || '');
    if (!m) return null;
    var st = Number(m[1]) * 60 + Number(m[2]), en = m[3] ? Number(m[3]) * 60 + Number(m[4]) : st + 60;
    return en > st ? { s: st, e: en } : { s: st, e: st + 60 };
  }
  function render() {
    var wk = weekMode();
    document.querySelector('.calcard').classList.toggle('wk', wk);
    $('vMonth').setAttribute('aria-pressed', String(!wk)); $('vWeek').setAttribute('aria-pressed', String(wk));
    if (wk) renderWeek(); else renderMonth();
  }
  function renderWeek() {
    if (!weekStart) weekStart = sundayOf(todayIso);
    var bd = weekBounds();
    if (weekStart < bd.lo) weekStart = bd.lo;
    if (weekStart > bd.hi) weekStart = bd.hi;
    var days = []; for (var i = 0; i < 7; i++) days.push(dayAdd(weekStart, i));
    var d1 = new Date(days[0] + 'T12:00:00'), d2 = new Date(days[6] + 'T12:00:00');
    $('title').textContent = d1.getFullYear() + '년 ' + (d1.getMonth() + 1) + '월 ' + d1.getDate() + '일 ~ ' + (d1.getMonth() !== d2.getMonth() ? (d2.getMonth() + 1) + '월 ' : '') + d2.getDate() + '일';
    $('prev').disabled = weekStart <= bd.lo; $('next').disabled = weekStart >= bd.hi;
    var note = $('rangeNote');
    if (rangeTo && days[6] > rangeTo) {
      note.textContent = '※ 출장·연가는 ' + Number(rangeTo.slice(5, 7)) + '월 ' + Number(rangeTo.slice(8)) + '일까지만 조회합니다. 그 이후 날짜에 표시가 없어도 부재가 없다는 뜻은 아닙니다.';
      note.style.display = 'block';
    } else { note.style.display = 'none'; }

    // 시간이 있는 단일일 일정은 시간표에, 나머지(시간 없음·여러 날)는 '종일' 줄에
    var timed = {}, hs = 8, he = 20;
    days.forEach(function (k) {
      timed[k] = [];
      (items[k] || []).forEach(function (it) {
        var tr = it.sp.start === it.sp.end ? parseTime(it.sp.time) : null;
        if (tr) { timed[k].push({ it: it, s: tr.s, e: tr.e }); hs = Math.min(hs, Math.floor(tr.s / 60)); he = Math.max(he, Math.ceil(tr.e / 60)); }
      });
    });
    var H = (he - hs) * PX;
    var root = $('weekview'); root.textContent = '';

    var head = el('div', 'wv-row'); head.appendChild(el('div', 'gut'));
    var hd = el('div', 'wv-days');
    days.forEach(function (k, i) {
      var bt = el('button', 'wv-day' + (i === 0 ? ' sun' : '') + (i === 6 ? ' sat' : '') + (k === todayIso ? ' today' : '') + (k === selected ? ' selected' : ''));
      bt.type = 'button'; bt.setAttribute('data-date', k);
      bt.appendChild(document.createTextNode(DOW[i]));
      bt.appendChild(el('b', null, String(Number(k.slice(8)))));
      hd.appendChild(bt);
    });
    head.appendChild(hd); root.appendChild(head);

    var ad = el('div', 'wv-row wv-allday'); ad.appendChild(el('div', 'gut', '종일'));
    var adg = el('div', 'wv-ad'), bg = el('div', 'cellbg');
    days.forEach(function (k) { var c = el('button', 'cell' + (k === todayIso ? ' today' : '')); c.type = 'button'; c.setAttribute('data-date', k); c.setAttribute('aria-label', k); bg.appendChild(c); });
    adg.appendChild(bg);
    var segs = [];
    spans.forEach(function (sp) {
      if (sp.start > days[6] || sp.end < days[0]) return;
      if (sp.start === sp.end && parseTime(sp.time)) return;
      var st = sp.start > days[0] ? sp.start : days[0], en = sp.end < days[6] ? sp.end : days[6];
      segs.push({ sp: sp, cs: days.indexOf(st), ce: days.indexOf(en), cl: sp.start < st, cr: sp.end > en });
    });
    segs.sort(function (a, b) { return a.cs - b.cs || (b.ce - b.cs) - (a.ce - a.cs) || ORDER[a.sp.kind] - ORDER[b.sp.kind]; });

    }
    if (!uwin) {
      pill([{ t: '출장·연가 갱신 ' }, { b: '정보 없음' }], 'stale');
      banner('⚠ 갱신 지연 — 일정 데이터를 불러오지 못했습니다. 표시된 정보가 없거나 오래됐을 수 있습니다.');
    } else {
      var age = (Date.now() - new Date(uwin.generatedAt).getTime()) / 3600000, stale = !(age <= STALE_HOURS);
      pill([{ t: '출장·연가 갱신 ' }, { b: fmtTs(uwin.generatedAt) }], '');
    }
    pill([{ t: '주간보고 반영 ' }, { b: ev.updatedAt ? String(ev.updatedAt).replace(/\s*\([^)]*\)\s*$/, '') : '아직 없음' }]);   // "(주간보고 11/23 기준)" 같은 괄호 설명은 표시하지 않음

    timetables = ev.timetable || []; holidays = ev.holidays || [];
    if (timetables.length) $('ttLabel').textContent = timetables[0].label || '수업시간표';
    else $('ttWrap').style.display = 'none';
    $('ttOn').checked = ttOn;
    var TRACK_NAME = { all: '', C1: '평생교육', B3: '탄소중립' };
    var TRACK_TAG = { C1: '[평생] ', B3: '[탄소] ' };
    var TRACK_WHO = {
      C1: '평생교육 · 이상욱 · 유화숙 · 장준민 · 조인주 · 김정연 · 천아름',
      B3: '탄소중립 · 이상욱 · 장준민 · 이윤호 · 조인주 · 윤순영 · 김근아 · 최지현'
    };
    function inTrack(t) {              // t: 'all' | 'C1' | 'B3' | ['C1','B3'] | 없음(=모두)
      if (track === 'all' || t == null || t === 'all') return true;
      return Array.isArray(t) ? t.indexOf(track) >= 0 : t === track;
    }
    // 팀즈에서 뽑은 일정·제출 안내도 달력에 올린다(내 PC 위젯에서만). 모든 보기(전체·평생교육·탄소중립)에 표시.
    var ROOM_NAME = { chief: '앵커사업단 책임', group: '앵커사업단 단체팀즈' };
    var teamEvents = ((teams && teams.items) || []).map(function (t) {
      return { title: (t.kind === 'deadline' ? '[팀즈·마감] ' : '[팀즈] ') + t.title, date: t.date, endDate: t.endDate, time: t.time, track: 'all', desc: t.note, teams: { room: ROOM_NAME[t.room] || t.room, url: t.url, key: (t.msgId || t.title) + '|' + t.date } };
    });
    var allEvents = (ev.events || []).concat(expandRecurring(ev)).concat(teamEvents);
    var allLeaves = ((uwin && uwin.events) || []).concat(ev.manualLeaves || []);
    function rebuild() {
      items = {}; spans = [];
      var events = allEvents.filter(function (x) { return inTrack(x.track) && !(x.teams && doneSet[x.teams.key]); });   // 완료 처리한 팀즈 일정은 달력에서도 뺀다
      allLeaves.filter(function (e) { return inTrack(e.tracks); }).forEach(function (e) {
        var kind = e.type === '출장' ? 'trip' : 'leave';
        var linked = events.filter(function (x) {
          return e.type === '출장' && (x.who || []).indexOf(e.name) >= 0 && x.date <= e.end && (x.endDate || x.date) >= e.start;
        });
        var sp = { kind: kind, start: e.start, end: e.end, label: '(' + e.type + ') ' + e.name, time: e.from ? e.from + '~' + e.to : '', range: e.start !== e.end ? md(e.start) + '~' + md(e.end) : '' };
        spans.push(sp);
        eachDay(e.start, e.end, function (k) { add(k, { kind: kind, e: e, linked: linked, sp: sp }); });
      });
      events.forEach(function (x) {
        var end = x.endDate || x.date;
        var tag = track === 'all' && TRACK_TAG[x.track] ? TRACK_TAG[x.track] : '';
        var sp = { kind: 'event', teams: !!x.teams, start: x.date, end: end, label: tag + x.title, time: x.time || '', range: end !== x.date ? md(x.date) + '~' + md(end) : '' };
        spans.push(sp);
        eachDay(x.date, end, function (k) { add(k, { kind: 'event', x: x, sp: sp }); });
      });
    }
    // ── 팀즈 탭 ──
    var haveTeams = !!(teams && teams.messages);
    var room = 'all', seenBefore = '';
    try { seenBefore = localStorage.getItem('teamsSeen') || ''; } catch (e) {}
    function newest() { return ((teams && teams.messages) || []).reduce(function (m, x) { return x.at > m ? x.at : m; }, ''); }
    function unreadCount() { return ((teams && teams.messages) || []).filter(function (x) { return x.at > seenBefore && x.from !== '조인주'; }).length; }
    if (haveTeams) {
      $('teamsTab').hidden = false; $('lgTeams').hidden = false; TRACK_NAME.teams = '팀즈';
      var uc = unreadCount(); if (uc) { $('teamsBadge').textContent = uc > 99 ? '99+' : String(uc); $('teamsBadge').hidden = false; }
    }
    function fmtMsgTime(s) { var d = new Date(s); return pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' (' + DOW[d.getDay()] + ') ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
    // 완료 처리한 일정·제출 안내(이 PC에만 저장). 같은 메시지·같은 날짜면 다시 띄우지 않는다.
    var doneSet = {}, showDone = false;
    try { doneSet = JSON.parse(localStorage.getItem('teamsDone') || '{}') || {}; } catch (e) {}
    function doneKey(t) { return (t.msgId || t.title) + '|' + t.date; }
    function saveDone() { try { localStorage.setItem('teamsDone', JSON.stringify(doneSet)); } catch (e) {} }
    function renderTeams() {
      if (!haveTeams) return;
      $('teamsUpd').textContent = (teams.updatedAt ? '읽은 시각 ' + fmtTs(teams.updatedAt) : '') + (tstatus && tstatus.ok === false ? ' · ⚠ ' + (tstatus.message || '읽기 실패') : '');
      Array.prototype.forEach.call($('roomSeg').querySelectorAll('button'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-room') === room)); });
      var flagBy = {}; (teams.items || []).forEach(function (t) { if (t.msgId) flagBy[t.msgId] = t; });
      var box = $('tvItems'); box.textContent = '';
      var allIts = (teams.items || []).filter(function (t) { return room === 'all' || t.room === room; }).sort(function (a, b) { return a.date.localeCompare(b.date); });
      var its = allIts.filter(function (t) { return !doneSet[doneKey(t)]; });
      var doneN = allIts.length - its.length;
      if (!its.length) box.appendChild(el('div', 'tv-empty', allIts.length ? '모두 완료했습니다.' : '날짜가 있는 일정·제출 안내가 없습니다.'));
      its.forEach(function (t) {
        var row = el('div', 'tv-item'), b = el('button', 'go'); b.type = 'button';
        b.appendChild(el('div', 'd', md(t.date) + (t.endDate && t.endDate !== t.date ? '~' + md(t.endDate) : '') + (t.time ? ' ' + t.time : '') + ' · ' + (ROOM_NAME[t.room] || '')));
        var tt = el('div', 't'); tt.appendChild(el('span', 'k' + (t.kind === 'deadline' ? ' deadline' : ''), t.kind === 'deadline' ? '마감' : '일정')); tt.appendChild(document.createTextNode(t.title)); b.appendChild(tt);
        b.addEventListener('click', function () { setTrack('all'); var dd = new Date(t.date + 'T12:00:00'); view.y = dd.getFullYear(); view.m = dd.getMonth(); weekStart = sundayOf(t.date); render(); openDrawer(t.date); });
        var ok = el('button', 'ok', '완료'); ok.type = 'button'; ok.title = '완료 처리(목록에서 숨김)';
        ok.addEventListener('click', function () { doneSet[doneKey(t)] = 1; saveDone(); rebuild(); renderTeams(); });
        row.appendChild(b); row.appendChild(ok);
        box.appendChild(row);
      });
      if (doneN) {
        var rb = el('button', 'tv-restore', '완료한 항목 ' + doneN + '건 ' + (showDone ? '숨기기' : '보기')); rb.type = 'button';
        rb.addEventListener('click', function () { showDone = !showDone; renderTeams(); });
        box.appendChild(rb);
        if (showDone) allIts.filter(function (t) { return doneSet[doneKey(t)]; }).forEach(function (t) {
          var row = el('div', 'tv-item done'), g = el('div', 'go');
          g.appendChild(el('div', 'd', md(t.date) + ' · ' + (ROOM_NAME[t.room] || ''))); g.appendChild(el('div', 't', t.title)); row.appendChild(g);
          var un = el('button', 'ok', '되돌리기'); un.type = 'button';
          un.addEventListener('click', function () { delete doneSet[doneKey(t)]; saveDone(); rebuild(); renderTeams(); });
          row.appendChild(un); box.appendChild(row);
        });
      }
      var mb = $('tvMsgs'); mb.textContent = '';
      var ms = (teams.messages || []).filter(function (m) { return room === 'all' || m.room === room; }).slice(0, 5);   // 최근 5개만
      if (!ms.length) mb.appendChild(el('div', 'tv-empty', '메시지가 없습니다.'));
      ms.forEach(function (m) {
        var w = el('div', 'tv-msg'), h = el('div', 'h');
        if (m.at > seenBefore && m.from !== '조인주') h.appendChild(el('i', 'new'));
        h.appendChild(el('b', null, m.from)); h.appendChild(document.createTextNode(fmtMsgTime(m.at))); h.appendChild(el('span', 'room', ROOM_NAME[m.room] || m.room));
        var fl = flagBy[m.id]; if (fl) h.appendChild(el('span', 'flag' + (fl.kind === 'deadline' ? ' deadline' : ''), fl.kind === 'deadline' ? '제출·마감 ' + md(fl.date) : '일정 ' + md(fl.date)));
        w.appendChild(h);
        var x = el('div', 'x', m.text || ''); w.appendChild(x);
        if ((m.text || '').length > 160 || (m.text || '').split('\n').length > 5) { var mo = el('button', 'more', '더보기'); mo.type = 'button'; mo.addEventListener('click', function () { var o = x.classList.toggle('open'); mo.textContent = o ? '접기' : '더보기'; }); w.appendChild(mo); }
        if (m.url) { var a = el('a', null, '팀즈에서 열기'); a.href = m.url; a.target = '_blank'; a.rel = 'noopener'; w.appendChild(a); }
        mb.appendChild(w);
      });
    }
    Array.prototype.forEach.call($('roomSeg').querySelectorAll('button'), function (b) { b.addEventListener('click', function () { room = b.getAttribute('data-room'); renderTeams(); }); });
    function setTrack(t, keepOpen) {
      if (t === 'teams' && !haveTeams) t = 'all';
      var wasTeams = track === 'teams';
      track = t; try { localStorage.setItem('track', t); } catch (e) {}
      Array.prototype.forEach.call($('trackSeg').querySelectorAll('button'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-track') === t)); });
      var isT = t === 'teams';
      document.querySelector('.calcard').style.display = isT ? 'none' : '';
      $('teamsView').classList.toggle('on', isT);
      if (isT) {
        renderTeams();
        var n = newest(); if (n) { try { localStorage.setItem('teamsSeen', n); } catch (e) {} }   // 열어서 본 것으로 처리(이번 화면에서는 새 글 표시를 유지)
        $('teamsBadge').hidden = true; closeDrawer();
        return;
      }
      if (wasTeams) { var n2 = newest(); if (n2) seenBefore = n2; }
      rebuild(); render();
    }
    Array.prototype.forEach.call($('trackSeg').querySelectorAll('button'), function (b) {
      b.addEventListener('click', function () { setTrack(b.getAttribute('data-track')); });
    });
    rangeTo = uwin ? uwin.rangeTo : null;
    var saved = 'all'; try { saved = localStorage.getItem('track') || 'all'; } catch (e) {}
    var hh = (location.hash || '').replace('#', ''); if (TRACK_NAME[hh] !== undefined) saved = hh;   // 주소 끝에 #C1 · #B3 를 붙이면 그 보기로 연다
    setTrack(TRACK_NAME[saved] !== undefined ? saved : 'all');
  });
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { render(); });
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(render, 150); });
})();
</script>
</body>
</html>
